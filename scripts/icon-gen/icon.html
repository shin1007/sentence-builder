<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  #frame {
    width: 512px;
    height: 512px;
    overflow: hidden;
  }
  #frame .scaler {
    width: 512px;
    height: 512px;
    transform-origin: top left;
  }
  .stage {
    width: 512px;
    height: 512px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 30% 22%, #6f5bff 0%, #4b32e0 42%, #2c1c9c 100%);
    font-family: 'Baloo 2', 'Arial Rounded MT Bold', Arial, sans-serif;
    overflow: hidden;
  }
  .stage.safe {
    /* maskable icons keep content within the inner 80% safe zone */
    background: radial-gradient(circle at 30% 22%, #6f5bff 0%, #4b32e0 42%, #2c1c9c 100%);
  }
  .stage.plain {
    border-radius: 108px;
  }
  .glow {
    position: absolute;
    width: 640px;
    height: 640px;
    top: -120px;
    left: -80px;
    background: radial-gradient(circle, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0) 60%);
  }
  .tiles {
    position: relative;
    display: flex;
    gap: 20px;
    z-index: 2;
  }
  .tile {
    width: 118px;
    height: 118px;
    border-radius: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 68px;
    color: #2c1c9c;
    box-shadow: 0 10px 0 rgba(0,0,0,0.18), 0 18px 30px rgba(0,0,0,0.28);
    letter-spacing: -2px;
  }
  .tile.a { background: #ffd23f; transform: rotate(-8deg) translateY(6px); }
  .tile.b { background: #ffffff; transform: translateY(-14px); }
  .tile.c { background: #5be0c0; transform: rotate(8deg) translateY(6px); }
  .stage.mask { border-radius: 0; }
  .stage.mask .tiles { transform: scale(0.78); }
</style>
</head>
<body>
  <div id="frame">
    <div class="scaler" id="scaler">
      <div class="stage plain" id="stage">
        <div class="glow"></div>
        <div class="tiles">
          <div class="tile a">A</div>
          <div class="tile b">B</div>
          <div class="tile c">C</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
